dataset:
  title: "Ngulia ringing dataset"
  data_title: "Long-term Bird Migration Monitoring at Ngulia, Kenya: Ringing, Counts, Moult and Recoveries"
  description: >-
    Research data and reproducible processing workflows for the Ngulia ringing project.
  data_description: >-
    Curated ringing events, moult records, daily counts, daily coverage, modeled daily
    covariates, daily effort evidence, source-linked operations history, and recovery records from the Ngulia
    ringing project in Kenya.
  language: "eng"
  license: "CC-BY-4.0"
  rights_holder: ""
  contact_email: "raphael.nussbaumer@arocha.org"
  keywords:
    - "bird ringing"
    - "bird migration"
    - "Kenya"
    - "Ngulia"
  geographic_coverage:
    description: "Ngulia, Tsavo West National Park, Kenya"
    country: "Kenya"
    country_code: "KE"
    latitude: -3.0136108277390288
    longitude: 38.210975578819976
    coordinate_uncertainty_m: 20
  temporal_coverage:
    start: "1969-10-20"
    end: "2024-01-12"
  methods_summary: >-
    Heterogeneous annual workbooks are imported, corrected through explicit configuration,
    harmonized into consistent event and species-day tables, quality checked, and exported
    without modifying the raw source files. The recovery table was consolidated once from
    all identifiable project evidence, manually deduplicated and curated, and is not regenerated
    by the processing workflow.
  limitations_summary: >-
    Ngulia catch totals reflect migration intensity together with weather, attraction to lights,
    ringing effort, protocol changes, and processing capacity. Dates without documented ringing
    are treated as unknown coverage rather than known zero-catch days.


files:
  - name: "ring_events.csv"
    description: "One cleaned ringing event per row, including biometrics, mapped ringer name, and moult fields when recorded."
  - name: "daily_counts.csv"
    description: "Positive species-day counts from the selected source."
  - name: "daily_coverage.csv"
    description: "Canonical daily catch, coverage/effort evidence, observed metadata, calibrated mist probability, and ERA5 weather."
  - name: "recoveries.csv"
    description: "Curated recovery and control movements involving Ngulia, with standardized dates, locations, and encounter outcomes."
  - name: "operations_history.csv"
    path: "config/daily_covariates/operations_history.csv"
    description: "Source- and page-linked historical operations states and events; broad periods remain contextual rather than imputed daily measurements."

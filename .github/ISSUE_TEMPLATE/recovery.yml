name: Report a bird recovery
description: Submit a dated recovery or control involving Ngulia
title: "Recovery: [ring number]"
labels: [recovery]
body:
  - type: markdown
    attributes:
      value: |
        Please report one encounter per issue and use the dates and location on the original notification. Dates must be exact calendar dates in YYYY-MM-DD format. Attach or link the notification so the record can be checked. Do not estimate coordinates from a place name.

  - type: input
    id: species
    attributes:
      label: Species
      description: Common or scientific name as shown in the notification. The project will standardize the name.
      placeholder: e.g. Marsh Warbler / Acrocephalus palustris
    validations:
      required: true

  - type: input
    id: ring_scheme
    attributes:
      label: Ring scheme or ringing centre
      description: The organisation or country printed on the ring or notification.
      placeholder: e.g. Nairobi, Stockholm, BTO
    validations:
      required: true

  - type: input
    id: ring_number
    attributes:
      label: Ring number
      description: Copy exactly, including letters, spaces, and leading zeroes.
      placeholder: e.g. 0123456
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: Where was the bird ringed?
      options:
        - Ringed at Ngulia; encountered elsewhere
        - Ringed elsewhere; encountered at Ngulia
    validations:
      required: true

  - type: input
    id: ringing_date
    attributes:
      label: Ringing date
      description: Exact date on the ringing record, in YYYY-MM-DD format.
      placeholder: e.g. 2025-12-07
    validations:
      required: true

  - type: input
    id: encounter_date
    attributes:
      label: Encounter date
      description: Exact date the bird was found, seen, controlled, or recaptured, in YYYY-MM-DD format.
      placeholder: e.g. 2026-03-14
    validations:
      required: true

  - type: input
    id: other_site
    attributes:
      label: Location outside Ngulia
      description: Locality, town, or named site as reported in the notification.
    validations:
      required: true

  - type: input
    id: other_region
    attributes:
      label: Region outside Ngulia, if reported
      description: Province, district, state, or similar region.

  - type: input
    id: other_country
    attributes:
      label: Country outside Ngulia
    validations:
      required: true

  - type: input
    id: other_latitude
    attributes:
      label: Latitude outside Ngulia, if measured or reported
      description: Decimal degrees from the source; negative values are south. Leave blank if unavailable.
      placeholder: e.g. -1.2864

  - type: input
    id: other_longitude
    attributes:
      label: Longitude outside Ngulia, if measured or reported
      description: Decimal degrees from the source; negative values are west. Leave blank if unavailable.
      placeholder: e.g. 36.8172

  - type: dropdown
    id: encounter_outcome
    attributes:
      label: Encounter outcome
      options:
        - Controlled or recaptured alive by a ringer
        - Found or observed alive
        - Found dead or killed
    validations:
      required: true

  - type: input
    id: ringing_age_code
    attributes:
      label: EURING age code at ringing, if reported
      description: Copy the code from the ringing record; do not infer age from the date.

  - type: textarea
    id: circumstances
    attributes:
      label: Encounter circumstances, if reported
      description: Include any cause of death, such as collision, hunting, or predation.

  - type: textarea
    id: source
    attributes:
      label: Source notification or evidence
      description: Attach the notification, paste its text, or provide a link. Include coordinate provenance if coordinates were supplied.
    validations:
      required: true
